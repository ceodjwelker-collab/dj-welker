<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CE OS">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8d6bff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#5a3bd6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121016"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.16" stop-color="#e8ecf2"/>
      <stop offset="0.38" stop-color="#aab2bd"/>
      <stop offset="0.49" stop-color="#565d68"/>
      <stop offset="0.51" stop-color="#c4cad3"/>
      <stop offset="0.68" stop-color="#f6f9fc"/>
      <stop offset="0.85" stop-color="#838a95"/>
      <stop offset="1" stop-color="#cfd5dd"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a6ff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#c4cad3"/>
      <stop offset="0.52" stop-color="#777e89"/><stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- bold chrome blade-shard emblem -->
  <g transform="translate(256,196)">
    <!-- purple under-glow shard -->
    <path d="M 0,-104 L 70,-6 L 0,118 L -70,-6 Z" fill="url(#edge)" opacity="0.35" transform="translate(0,6)"/>
    <!-- main shard -->
    <path d="M 0,-100 L 66,-4 L 0,112 L -66,-4 Z" fill="url(#chrome)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- facets -->
    <g stroke="#2e3138" stroke-opacity="0.55" stroke-width="1.6">
      <line x1="-66" y1="-4" x2="66" y2="-4"/>
      <line x1="0" y1="-100" x2="0" y2="112"/>
    </g>
    <!-- specular highlight -->
    <path d="M 0,-100 L 66,-4 L 0,-4 Z" fill="#ffffff" opacity="0.5"/>
    <!-- accent rim light -->
    <path d="M 0,-100 L -66,-4 L 0,112" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- heavy wordmark -->
  <g transform="translate(256,378)" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="0" font-size="112" font-weight="900" letter-spacing="2" fill="url(#wm)" stroke="#fff" stroke-opacity="0.2" stroke-width="1">CE OS</text>
    <rect x="-96" y="22" width="192" height="3" rx="1.5" fill="url(#edge)"/>
    <text x="0" y="50" font-size="17" font-weight="800" letter-spacing="11" fill="#7d7486">BUILD THE EMPIRE</text>
  </g>
</svg>
